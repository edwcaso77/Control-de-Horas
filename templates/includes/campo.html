<div class="campo{% if campo.errors %} con-error{% endif %}{% if campo.widget_type == 'checkbox' %} campo-casilla{% endif %}">
    {% if campo.widget_type == 'checkbox' %}
        <label for="{{ campo.id_for_label }}">{{ campo }} {{ campo.label|capfirst }}</label>
    {% else %}
        <label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}{% if campo.field.required %} <span class="requerido">*</span>{% endif %}</label>
        {{ campo }}
    {% endif %}
    {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
    {% for error in campo.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
