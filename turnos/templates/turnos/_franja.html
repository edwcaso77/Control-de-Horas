<div class="franja franja-{{ clase }}">
    <span class="franja-titulo">{{ titulo }}{% if asignaciones %} · {{ asignaciones|length }}{% endif %}</span>
    {% for a in asignaciones %}
        <span class="persona" style="background: {{ a.tipo_turno.color }}; color: {{ a.tipo_turno.color_texto }}"
              title="{{ a.funcionario.nombre_completo }} · {{ a.tipo_turno.nombre }} {{ a.tipo_turno.horario }}">
            <b>{{ a.tipo_turno.abreviatura }}</b> {{ a.funcionario.nombre_corto }}
        </span>
    {% empty %}
        <span class="franja-vacia">—</span>
    {% endfor %}
</div>
